name: Web preview (GitHub Pages)
on:
  push:
    branches: [claude/supabase-integration]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # pnpm-lock.yaml package.json ile uyumsuz; bu yüzden frozen değil.
      - run: pnpm install --no-frozen-lockfile
      - run: npx tsc --noEmit
      # Pages alt yolda (/<repo>/) servis edilir; yalnızca derleme sırasında baseUrl eklenir.
      - name: Set baseUrl for Pages
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/${{ github.event.repository.name }}'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      # Bilerek Supabase ortam değişkeni verilmez: önizleme "Supabase yapılandırması gerekli" ekranını gösterir, hiçbir anahtar yayınlanmaz.
      - run: npx expo export --platform web
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
